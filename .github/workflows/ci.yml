name: CI

on:
  push:
    paths-ignore:
      - "*.md"
      - LICENSE

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CACHE_UUID: ${{ secrets.CACHE_UUID }}

permissions:
  contents: read # Needed to check out code

jobs:
  dry-deploy:
    name: Dry-deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to communicate with AWS
      contents: read
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          dry-run: "true"
          environment: dev

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deps
      - run: node_modules/.bin/prettier --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deps
      - run: npm run lint

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
      - run: shellcheck *.sh

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deps
      - run: npm test

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deps
      - run: npm run check

  # If CI passes on main branch, kick off a dev deploy.
  deploy-dev:
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    needs: [dry-deploy, format, lint, shellcheck, tests, typecheck]
    uses: ./.github/workflows/deploy-dev.yml
