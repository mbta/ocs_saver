name: Deploy to Prod

on:
  workflow_dispatch:

permissions: {}

env:
  CACHE_UUID: ${{ secrets.CACHE_UUID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed to assume the AWS deploy role via OIDC
      contents: read
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          environment: prod
