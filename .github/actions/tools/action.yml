name: Set up tools
description: Loads asdf tools for a CI job, installing them if not cached
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: asdf-cache
      with:
        path: ~/.asdf
        key: ${{ env.CACHE_UUID }}-asdf-${{ hashFiles('.tool-versions') }}

    - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      if: "!steps.asdf-cache.outputs.cache-hit"

    - uses: mbta/actions/reshim-asdf@af587ca71a208f34ae1271bd16a7bc98b4adfbcb # v1.24
