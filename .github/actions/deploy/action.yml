name: Deploy
description: Deploys new Lambda function code
inputs:
  role-to-assume:
    description: AWS access key
    required: true
  dry-run:
    description: >-
      If truthy, the deploy will be a dry run, or will not be attempted at all
      if `aws-role-to-assume` is blank (instead of erroring)
    required: false
    default: ""
  environment:
    description: Name of the environment to deploy to (dev/prod)
    required: true
runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      # Only configure AWS credentials if not doing a dry run or if a role is provided
      if: ${{ !inputs.dry-run || inputs.role-to-assume }}
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: us-east-1

    - uses: ./.github/actions/deps

    - run: ./build.sh src/packager.ts
      shell: bash
    - run: ./build.sh src/processor.ts
      shell: bash

    - run: >-
        aws lambda update-function-code
        --function-name ocs-saver-${ENVIRONMENT}-packager
        --zip-file fileb://dist/packager.zip
        ${DRY_RUN_OPT}
      shell: bash
      if: ${{ !inputs.dry-run || inputs.role-to-assume }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        DRY_RUN_OPT: ${{ inputs.dry-run && '--dry-run' || '' }}
    - run: >-
        aws lambda update-function-code
        --function-name ocs-saver-${ENVIRONMENT}-firehose-processor
        --zip-file fileb://dist/processor.zip
        ${DRY_RUN_OPT}
      shell: bash
      if: ${{ !inputs.dry-run || inputs.role-to-assume }}
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        DRY_RUN_OPT: ${{ inputs.dry-run && '--dry-run' || '' }}
